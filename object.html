<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Object — sound reactive</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070c;
      color: #d7e7f5;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 10;
      text-align: center;
      padding: 1.5rem;
      background:
        radial-gradient(800px 480px at 30% 20%, #1a3055aa, transparent 55%),
        #05070cee;
    }
    #ui.hidden { display: none; }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin: 0 0 0.5rem;
    }
    p {
      color: #8aa3ba;
      max-width: 28rem;
      margin: 0 auto 1.2rem;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
    }
    button, a.btn {
      border: 0;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.2rem;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
    }
    #start { background: #6ec8ff; color: #041018; }
    a.btn {
      border: 1px solid #2a3d55;
      color: #cfe6f8;
      background: transparent;
    }
    #hud {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      z-index: 5;
      font-size: 0.75rem;
      color: #7f93a8;
      opacity: 0;
      transition: opacity 0.3s;
      line-height: 1.45;
      pointer-events: none;
    }
    #hud.show { opacity: 1; }
    #status {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      font-size: 0.8rem;
      color: #8aa3ba;
      pointer-events: none;
    }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2305060a' width='32' height='32'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%236ec8ff'/%3E%3C/svg%3E" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="status">Loading model…</div>
  <div id="ui">
    <div>
      <h1>Object</h1>
      <p>
        Quiet mic → clear Beethoven. Louder → TV / seismic interference.
        Bass / mids / highs drive X / Y / Z spin (never fully stops).
      </p>
      <div class="actions">
        <button id="start" type="button">Start microphone</button>
        <a class="btn" href="index.html">Home</a>
      </div>
      <p id="err" style="color:#ff8a8a;font-size:0.85rem;min-height:1.2em;margin-top:0.8rem;"></p>
    </div>
  </div>
  <div id="hud">
    quiet = Beethoven · loud = interference<br />
    bass→X · mids→Y · highs→Z · atmosphere depth lines
  </div>

  <script type="module">
    import * as THREE from "three"
    import { OrbitControls } from "three/addons/controls/OrbitControls.js"
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"

    const statusEl = document.getElementById("status")
    const ui = document.getElementById("ui")
    const hud = document.getElementById("hud")
    const errEl = document.getElementById("err")

    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x05070c)

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.05,
      100
    )
    camera.position.set(0, 0.6, 4.2)

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.2
    renderer.outputColorSpace = THREE.SRGBColorSpace
    document.body.appendChild(renderer.domElement)

    scene.add(new THREE.AmbientLight(0xffffff, 0.4))
    scene.add(new THREE.HemisphereLight(0xb8d4ff, 0x1a120c, 0.9))
    const key = new THREE.DirectionalLight(0xffffff, 1.15)
    key.position.set(3, 5, 2)
    scene.add(key)

    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true
    controls.dampingFactor = 0.06
    controls.minDistance = 1.2
    controls.maxDistance = 10
    controls.target.set(0, 0.15, 0)

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    // ------------------------------------------------------------
    // AUDIO
    // ------------------------------------------------------------

    const fftBins = new Float32Array(8)
    let audioCtx = null
    let analyser = null
    let freqData = null

    async function startMic() {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: true
        },
        video: false
      })
      audioCtx = new AudioContext()
      const source = audioCtx.createMediaStreamSource(stream)
      const micGain = audioCtx.createGain()
      micGain.gain.value = 4.5
      analyser = audioCtx.createAnalyser()
      analyser.fftSize = 512
      analyser.smoothingTimeConstant = 0.72
      source.connect(micGain)
      micGain.connect(analyser)
      freqData = new Uint8Array(analyser.frequencyBinCount)
    }

    function sampleFft() {
      if (analyser == null || freqData == null) return
      analyser.getByteFrequencyData(freqData)
      const n = freqData.length
      const per = Math.floor(n / 8)
      for (let i = 0; i < 8; i++) {
        let sum = 0
        const start = i * per
        const end = i === 7 ? n : start + per
        for (let j = start; j < end; j++) sum += freqData[j]
        const next = Math.min(3.5, ((sum / (end - start)) / 255) * 4.5)
        fftBins[i] += (next - fftBins[i]) * 0.45
      }
    }

    function bass() {
      return fftBins[0] * 0.5 + fftBins[1] * 0.35 + fftBins[2] * 0.15
    }
    function mids() {
      return fftBins[2] * 0.25 + fftBins[3] * 0.4 + fftBins[4] * 0.35
    }
    function highs() {
      return fftBins[5] * 0.3 + fftBins[6] * 0.4 + fftBins[7] * 0.3
    }

    let eBass = 0.12
    let eMid = 0.1
    let eHigh = 0.08
    // Overall "how interfered" — 0 = pure Beethoven, 1 = full TV/seismic
    let eSignal = 0

    function updateEnvelopes() {
      eBass += (0.08 + bass() * 1.35 - eBass) * 0.28
      eMid += (0.06 + mids() * 1.15 - eMid) * 0.26
      eHigh += (0.05 + highs() * 1.25 - eHigh) * 0.32
      const raw =
        eBass * 0.45 + eMid * 0.3 + eHigh * 0.25
      // Soft knee so quiet stays readable longer
      const target = Math.max(0, Math.min(1, (raw - 0.18) / 1.1))
      eSignal += (target - eSignal) * 0.22
    }

    // ------------------------------------------------------------
    // SHADER: clean Beethoven ↔ interference by eSignal
    // ------------------------------------------------------------

    const uniforms = {
      uMap: { value: null },
      uTime: { value: 0 },
      uBass: { value: 0 },
      uMid: { value: 0 },
      uHigh: { value: 0 },
      uSignal: { value: 0 }
    }

    const interferenceMat = new THREE.ShaderMaterial({
      uniforms,
      lights: false,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vPos;
        uniform float uTime;
        uniform float uBass;
        uniform float uMid;
        uniform float uHigh;
        uniform float uSignal;

        void main() {
          vUv = uv;
          vec3 p = position;
          // Tremor only when signal is present
          float shake = (uBass * 0.045 + uHigh * 0.02) * uSignal;
          p.x += sin(uTime * 9.0 + position.y * 12.0) * shake;
          p.y += cos(uTime * 11.0 + position.x * 10.0) * shake * 0.85;
          p.z += sin(uTime * 13.0 + position.x * 8.0 + position.y * 6.0) * shake * 0.7;
          p += normal * (sin(uTime * 2.2 + position.y * 3.0) * uMid * 0.02 * uSignal);
          vPos = p;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uMap;
        uniform float uTime;
        uniform float uBass;
        uniform float uMid;
        uniform float uHigh;
        uniform float uSignal;
        varying vec2 vUv;
        varying vec3 vPos;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        void main() {
          // Clean Beethoven sample
          vec3 clean = texture2D(uMap, vUv).rgb;

          // --- interfered path ---
          float tear = sin(vUv.y * 40.0 + uTime * 6.0) * uBass * 0.012
                     + sin(vUv.y * 120.0 - uTime * 14.0) * uHigh * 0.008;
          float roll = fract(uTime * (0.05 + uMid * 0.15)) * uMid * 0.04;
          vec2 uv = vUv + vec2(tear, roll) * uSignal;

          float aberr = (uHigh * 0.006 + uBass * 0.003) * uSignal;
          float r = texture2D(uMap, uv + vec2(aberr, 0.0)).r;
          float g = texture2D(uMap, uv).g;
          float b = texture2D(uMap, uv - vec2(aberr, 0.0)).b;
          vec3 col = vec3(r, g, b);

          float scan = 0.88 + 0.12 * sin((vUv.y + uTime * 0.02) * 900.0);
          col *= mix(1.0, scan, uSignal);

          float n = hash(vec2(vUv.x * 220.0, vUv.y * 180.0 + floor(uTime * 18.0)));
          float snowAmt = (uHigh * 0.55 + uBass * 0.15) * uSignal;
          vec3 phosphor = mix(
            vec3(0.15, 0.85, 0.35),
            vec3(0.95, 0.55, 0.12),
            step(0.55, n)
          );
          col = mix(col, col * phosphor * 1.1, snowAmt * step(0.72, n));

          float wave = abs(sin(vUv.x * 25.0 + uTime * 4.0 + uBass * 8.0));
          float band = smoothstep(0.02, 0.0, abs(vUv.y - (0.35 + uMid * 0.2 + wave * 0.08 * uBass)));
          col += vec3(0.1, 0.55, 0.25) * band * (uBass + uMid) * 0.65 * uSignal;

          float bar = smoothstep(0.04, 0.0, abs(fract(vUv.y * 0.7 + uTime * (0.08 + uHigh * 0.2)) - 0.5));
          col += vec3(0.2, 0.45, 0.15) * bar * uHigh * 0.4 * uSignal;

          col = clamp(col, 0.0, 1.0);

          // uSignal 0 = pure bust, 1 = full interference
          vec3 finalCol = mix(clean, col, uSignal);
          gl_FragColor = vec4(finalCol, 1.0);
        }
      `
    })

    // ------------------------------------------------------------
    // ATMOSPHERE
    // ------------------------------------------------------------

    const atmosphereGroup = new THREE.Group()
    scene.add(atmosphereGroup)

    const atmoMat = new THREE.LineBasicMaterial({
      color: new THREE.Color(0.45, 0.7, 1.0),
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })

    function buildAtmosphere() {
      const positions = []
      const half = 4
      const step = 2.0
      const clearRadius = 2.2
      const segLen = 0.22

      for (let ix = -half; ix <= half; ix++) {
        for (let iy = -half; iy <= half; iy++) {
          for (let iz = -half; iz <= half; iz++) {
            const x = ix * step
            const y = iy * step
            const z = iz * step
            const r2 = x * x + y * y + z * z
            if (r2 < clearRadius * clearRadius) continue
            if (r2 > (half * step * 0.95) * (half * step * 0.95)) continue

            const len = Math.sqrt(r2) || 1
            const dx = x / len
            const dy = y / len
            const dz = z / len
            const tx = -dz
            const tz = dx
            const hx = dx * 0.45 + tx * 0.55
            const hy = dy * 0.45
            const hz = dz * 0.45 + tz * 0.55
            const hl = Math.sqrt(hx * hx + hy * hy + hz * hz) || 1

            positions.push(
              x - (hx / hl) * segLen * 0.5,
              y - (hy / hl) * segLen * 0.5,
              z - (hz / hl) * segLen * 0.5,
              x + (hx / hl) * segLen * 0.5,
              y + (hy / hl) * segLen * 0.5,
              z + (hz / hl) * segLen * 0.5
            )
          }
        }
      }

      const geom = new THREE.BufferGeometry()
      geom.setAttribute(
        "position",
        new THREE.BufferAttribute(new Float32Array(positions), 3)
      )
      atmosphereGroup.add(new THREE.LineSegments(geom, atmoMat))
    }
    buildAtmosphere()

    // ------------------------------------------------------------
    // MODEL
    // ------------------------------------------------------------

    const root = new THREE.Group()
    scene.add(root)
    let model = null

    const texLoader = new THREE.TextureLoader()
    const colorTex = texLoader.load(
      "object-color.jpg",
      () => {
        colorTex.colorSpace = THREE.SRGBColorSpace
        colorTex.flipY = false
        colorTex.needsUpdate = true
        uniforms.uMap.value = colorTex
        statusEl.textContent = ""
      },
      undefined,
      () => {
        statusEl.textContent = "Color texture missing — check object-color.jpg"
      }
    )
    colorTex.colorSpace = THREE.SRGBColorSpace
    colorTex.flipY = false
    colorTex.wrapS = THREE.RepeatWrapping
    colorTex.wrapT = THREE.RepeatWrapping
    uniforms.uMap.value = colorTex

    const loader = new GLTFLoader()
    loader.load(
      "object.glb",
      (gltf) => {
        model = gltf.scene
        model.traverse((obj) => {
          if (obj.isMesh != null && obj.isMesh) {
            obj.castShadow = false
            obj.receiveShadow = false
            obj.material = interferenceMat
            obj.material.needsUpdate = true
          }
        })
        root.add(model)
        statusEl.textContent = ""
      },
      (ev) => {
        if (ev.total > 0) {
          statusEl.textContent =
            "Loading model… " + Math.round((100 * ev.loaded) / ev.total) + "%"
        }
      },
      (err) => {
        console.error(err)
        statusEl.textContent = "Failed to load object.glb"
        errEl.textContent = String(err)
      }
    )

    // ------------------------------------------------------------
    // LOOP — 3 axes from bass/mid/high, never zero speed
    // ------------------------------------------------------------

    // Minimum angular speeds (rad/frame-ish) so axes never stop
    const MIN_X = 0.00035
    const MIN_Y = 0.00045
    const MIN_Z = 0.0003

    function tick(now) {
      const t = now * 0.001
      sampleFft()
      updateEnvelopes()
      controls.update()

      uniforms.uTime.value = t
      uniforms.uBass.value = eBass
      uniforms.uMid.value = eMid
      uniforms.uHigh.value = eHigh
      uniforms.uSignal.value = eSignal

      if (model != null) {
        // Slight scale only when signal rises
        const s = 1 + eBass * 0.12 * eSignal
        root.scale.setScalar(s)

        // Each band paces one axis; floor keeps motion alive when quiet
        const spdX = MIN_X + eBass * 0.0045
        const spdY = MIN_Y + eMid * 0.0055
        const spdZ = MIN_Z + eHigh * 0.004
        root.rotation.x += spdX
        root.rotation.y += spdY
        root.rotation.z += spdZ

        root.position.x = Math.sin(t * 0.2) * 0.05 * (0.25 + eMid)
        root.position.y = Math.sin(t * 0.27) * 0.04 * (0.25 + eBass)
        root.position.z = Math.cos(t * 0.17) * 0.035 * (0.25 + eHigh)
      }

      atmosphereGroup.rotation.y = root.rotation.y * 0.25
      atmosphereGroup.rotation.x = root.rotation.x * 0.15

      renderer.toneMappingExposure = 1.12 + eBass * 0.06 * eSignal
      renderer.render(scene, camera)
      requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)

    document.getElementById("start").addEventListener("click", async () => {
      errEl.textContent = ""
      try {
        await startMic()
        if (audioCtx != null && audioCtx.state === "suspended") {
          await audioCtx.resume()
        }
        ui.classList.add("hidden")
        hud.classList.add("show")
      } catch (err) {
        console.warn("Mic unavailable:", err)
        errEl.textContent =
          "Microphone blocked or unavailable. Check Safari settings → Microphone."
        ui.classList.add("hidden")
        hud.classList.add("show")
        statusEl.textContent = "Running without mic"
      }
    })
  </script>
</body>
</html>
