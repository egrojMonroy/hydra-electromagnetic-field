<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HYDRA — choose a view</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 520px at 25% 10%, #143055 0%, transparent 55%),
        radial-gradient(700px 420px at 85% 90%, #0a2a28 0%, transparent 50%),
        #04060a;
      color: #d7e7f5;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    main {
      max-width: 28rem;
      margin: 0 auto;
      padding: 4.5rem 1.25rem 3rem;
      text-align: center;
    }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      margin: 0 0 0.6rem;
      letter-spacing: -0.02em;
    }
    .lede {
      color: #8aa3ba;
      line-height: 1.5;
      margin: 0 0 2rem;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    a.choice {
      display: block;
      padding: 1.15rem 1.25rem;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      border-radius: 2px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    a.choice:hover { transform: translateY(-1px); }
    a.field {
      background: #6ec8ff;
      color: #041018;
    }
    a.object {
      background: transparent;
      color: #e8f2ff;
      border: 1px solid #3a516c;
    }
    a.object:hover { background: rgba(255,255,255,0.06); }
    .hint {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #6a7f94;
      line-height: 1.4;
    }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2304060a' width='32' height='32'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%236ec8ff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet" />
</head>
<body>
  <main>
    <h1>Choose a view</h1>
    <p class="lede">Two separate experiences. Pick one:</p>
    <div class="choices">
      <a class="choice field" href="field.html">Electromagnetic field</a>
      <a class="choice object" href="object.html">Object</a>
    </div>
    <p class="hint">On the next screen, tap Start microphone to begin.</p>
  </main>
</body>
</html>
